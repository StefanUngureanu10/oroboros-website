server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Long-lived caching for hashed/static assets.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must always be revalidated so deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
